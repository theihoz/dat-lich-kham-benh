<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý dịch vụ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div class="container-fluid"><div class="row"><aside class="sidebar"><h5 class="text-white mb-4"><i class="bi bi-hospital me-2"></i>Quản trị</h5><nav class="nav flex-column"><a class="nav-link" href="dashboard.html">Tổng quan</a><a class="nav-link" href="analytics.html">Báo cáo</a><a class="nav-link" href="users.html">Người dùng</a><a class="nav-link" href="doctors.html">Duyệt bác sĩ</a><a class="nav-link" href="specialties.html">Chuyên khoa</a><a class="nav-link active" href="services.html">Dịch vụ</a></nav></aside><main><div class="d-flex justify-content-between mb-4"><div><h2 class="fw-bold">Danh mục dịch vụ</h2><p class="text-muted">Quản lý giá niêm yết và thời lượng khám.</p></div><button class="btn btn-primary" onclick="edit()">Thêm dịch vụ</button></div><div class="card p-3 table-responsive"><table class="table align-middle"><thead><tr><th>Mã</th><th>Dịch vụ</th><th>Chuyên khoa</th><th>Thời lượng</th><th>Giá</th><th>Trạng thái</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main></div></div><div class="modal fade" id="modal"><div class="modal-dialog"><form id="form" class="modal-content"><div class="modal-header"><h5 class="modal-title">Thông tin dịch vụ</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body row g-3"><input id="sid" type="hidden"><div class="col-4"><label>Mã</label><input id="code" class="form-control" required></div><div class="col-8"><label>Tên dịch vụ</label><input id="name" class="form-control" required></div><div class="col-12"><label>Chuyên khoa</label><select id="specialtyId" class="form-select"></select></div><div class="col-6"><label>Giá (VNĐ)</label><input id="price" type="number" min="0" class="form-control" required></div><div class="col-6"><label>Phút</label><input id="duration" type="number" min="5" value="30" class="form-control" required></div><div class="col-12"><label>Mô tả</label><textarea id="description" class="form-control"></textarea></div></div><div class="modal-footer"><button class="btn btn-primary">Lưu</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/auth.js"></script><script>Auth.checkAuth(['ADMIN']);const serviceNameInput=document.getElementById('name');let data=[],dialog=new bootstrap.Modal(modal);async function load(){data=(await Api.admin.services()).data;const sp=(await Api.admin.specialties()).data;specialtyId.innerHTML='<option value="">Đa khoa</option>'+sp.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');rows.innerHTML=data.map(x=>`<tr><td><code>${x.code}</code></td><td class="fw-bold">${x.name}</td><td>${x.specialtyName}</td><td>${x.durationMinutes} phút</td><td>${Utils.formatCurrency(x.defaultPrice)}</td><td>${x.active?'<span class="badge bg-success">Đang phục vụ</span>':'<span class="badge bg-secondary">Đã ngừng</span>'}</td><td><button class="btn btn-sm btn-outline-primary" onclick="edit(${x.id})">Sửa</button> ${x.active?`<button class="btn btn-sm btn-outline-danger" onclick="disable(${x.id})">Ngừng</button>`:''}</td></tr>`).join('')}function edit(id){form.reset();sid.value='';duration.value=30;const x=data.find(v=>v.id===id);if(x){sid.value=x.id;code.value=x.code;serviceNameInput.value=x.name;specialtyId.value=x.specialtyId||'';price.value=x.defaultPrice;duration.value=x.durationMinutes;description.value=x.description||''}dialog.show()}form.onsubmit=async e=>{e.preventDefault();const b={code:code.value,name:serviceNameInput.value,specialtyId:specialtyId.value?+specialtyId.value:null,defaultPrice:+price.value,durationMinutes:+duration.value,description:description.value,active:true};try{sid.value?await Api.admin.updateService(sid.value,b):await Api.admin.createService(b);dialog.hide();await load();Utils.showToast('Đã lưu dịch vụ','success')}catch(x){Utils.showToast(x.message,'danger')}};async function disable(id){if(confirm('Ngừng cung cấp dịch vụ này?')){await Api.admin.deleteService(id);load()}}load();</script></body></html>
