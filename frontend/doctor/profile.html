<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hồ Sơ Bác Sĩ - DatLichKhamBenh</title>
  <link href="../vendor/bootstrap.min.css?v=3017df4a76db" rel="stylesheet">
  <link href="../vendor/bootstrap-icons.css?v=bb6fd8cd8539" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=ac95df229b43">
  <style>
    body { background-color: #f8fafc; color: #1e293b; }
    .sidebar { background: #0f172a; color: #fff; min-height: 100vh; }
    .sidebar .nav-link { color: #94a3b8; border-radius: 10px; margin-bottom: 4px; padding: 10px 16px; font-weight: 500; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #1e293b; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
          <div class="bg-info text-white rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
            <i class="bi bi-heart-pulse-fill fs-4"></i>
          </div>
          <div>
            <h6 class="fw-bold mb-0 text-white">Bác Sĩ</h6>
            <small class="text-secondary">DatLichKhamBenh</small>
          </div>
        </div>

        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link d-flex align-items-center gap-2">
              <i class="bi bi-person-lines-fill fs-5"></i> Lịch Khám Bệnh Nhân
            </a>
          </li>
          <li class="nav-item">
            <a href="schedule.html" class="nav-link d-flex align-items-center gap-2">
              <i class="bi bi-clock-history fs-5"></i> Quản Lý Ca Khám
            </a>
          </li>
          <li class="nav-item">
            <a href="profile.html" class="nav-link active d-flex align-items-center gap-2">
              <i class="bi bi-person-gear fs-5"></i> Hồ Sơ Cá Nhân
            </a>
          </li>
        </ul>

        <hr class="text-secondary my-4">
        <div class="d-flex align-items-center justify-content-between px-2">
          <div class="fw-semibold text-white small" id="doctor-display-name"><i class="bi bi-person-badge me-1"></i>Bác sĩ</div>
          <button data-ui-click="action2" class="btn btn-outline-danger btn-sm border-0" title="Đăng xuất">
            <i class="bi bi-box-arrow-right fs-5"></i>
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2 class="fw-bold text-dark mb-1"><i class="bi bi-person-gear text-primary me-2"></i>Hồ Sơ Chuyên Môn</h2>
            <p class="text-muted mb-0">Cập nhật thông tin hành nghề và giá khám của bạn</p>
          </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <div id="profile-feedback" class="mb-3" role="status" aria-live="polite"></div><form id="profile-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
                <input id="fullName" class="form-control rounded-3" required minlength="2" placeholder="BS. Nguyễn Văn A">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email (không thể thay đổi)</label>
                <input id="email" class="form-control rounded-3 bg-light" disabled>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Số Điện Thoại</label>
                <input id="phone" class="form-control rounded-3" pattern="[0-9+]{9,15}" placeholder="0912345678">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Bằng Cấp / Học Vị</label>
                <input id="degree" class="form-control rounded-3" placeholder="Bác sĩ CKI, Thạc sĩ Y khoa...">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Số Năm Kinh Nghiệm</label>
                <input id="experienceYears" type="number" min="0" max="60" class="form-control rounded-3" placeholder="5">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Giá Khám (VNĐ)</label>
                <input id="consultationFee" type="number" min="0" class="form-control rounded-3" placeholder="200000">
              </div>
            </div>
            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold" id="btn-save">
                <i class="bi bi-check2-circle me-1"></i>Lưu Thay Đổi
              </button>
              <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-ui-click="action3">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Hủy Bỏ
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script defer src="../vendor/bootstrap.bundle.min.js?v=82f64f62bb03"></script>
  <script src="../js/api.js?v=4d8855c5ee40"></script>
  <script src="../js/utils.js?v=82f165ee9d32"></script>
  <script src="../js/auth.js?v=58ccc9a11049"></script>
  <script src="../js/pages/doctor-profile.js?v=a455d810acee"></script>
<script src="../js/ui-actions.js?v=5460146e952c"></script>
</body>
</html>
