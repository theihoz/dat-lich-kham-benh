services:
  # ─── MySQL Database ───────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: clinic_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datlichkhambenh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # ─── Redis Cache ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: clinic_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Backend trong container: docker compose --profile full up -d --build
  backend:
    profiles: ["full"]
    build: ./backend
    container_name: clinic_backend
    depends_on: [mysql, redis, rabbitmq]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/datlichkhambenh?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${CLINIC_HTTP_PORT:-18080}:8080"
    restart: on-failure

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
