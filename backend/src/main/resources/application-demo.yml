# Demo môn học: dữ liệu H2 trong RAM, được seed thật; khởi động lại sẽ đặt lại dữ liệu.
spring:
  datasource:
    url: jdbc:h2:mem:clinic-demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  rabbitmq:
    listener:
      simple:
        auto-startup: false
    dynamic: false
management:
  health:
    rabbit:
      enabled: false
    mail:
      enabled: false
app:
  jwt:
    secret: classroom-demo-only-secret-key-at-least-256-bits-long
