spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    defer-datasource-initialization: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  mail:
    host: ${MAIL_HOST}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
app:
  public-url: ${APP_PUBLIC_URL}
  metrics-token: ${METRICS_TOKEN}
  messaging:
    email-exchange: clinic.email.v2.exchange
    email-queue: clinic.email.v2.queue
    email-routing-key: clinic.email.v2.send
  cors:
    allowed-origins: ${APP_PUBLIC_URL}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  clinic:
    name: ${CLINIC_NAME:Phòng khám}
    address: ${CLINIC_ADDRESS:}
    phone: ${CLINIC_PHONE:}
server:
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
    com.datlichkhambenh: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    console: '%d{yyyy-MM-dd''T''HH:mm:ssXXX} level=%p requestId=%X{requestId:-none} logger=%logger{40} %m%n'
