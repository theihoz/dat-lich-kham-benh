<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký - DatLichKhamBenh</title>
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card" style="max-width:540px;">
      <div class="auth-logo">
        <div class="logo-icon">📝</div>
        <h1>Tạo Tài Khoản Mới</h1>
        <p>Đăng ký tài khoản để bắt đầu đặt lịch khám bệnh</p>
      </div>

      <div id="error-alert" role="alert" aria-live="polite" class="alert alert-error hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="role">Loại Tài Khoản</label>
          <select id="role" class="form-control">
            <option value="PATIENT">Bệnh nhân (Đăng ký tự do)</option>
            <option value="DOCTOR">Bác sĩ (Cần Admin phê duyệt)</option>
          </select>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-control" placeholder="user@gmail.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Mật khẩu</label>
            <input type="password" id="password" class="form-control" placeholder="Tối thiểu 8 ký tự" required minlength="8" maxlength="72">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="fullName">Họ và Tên</label>
          <input type="text" id="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label" for="phone">Số điện thoại</label>
            <input type="tel" id="phone" class="form-control" placeholder="0912345678" required>
          </div>

          <!-- Patient Fields -->
          <div class="form-group patient-field">
            <label class="form-label" for="dob">Ngày sinh</label>
            <input type="date" id="dob" class="form-control">
          </div>
        </div>

        <div class="grid grid-2 patient-field">
          <div class="form-group">
            <label class="form-label" for="gender">Giới tính</label>
            <select id="gender" class="form-control">
              <option value="MALE">Nam</option>
              <option value="FEMALE">Nữ</option>
              <option value="OTHER">Khác</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="address">Địa chỉ</label>
            <input type="text" id="address" class="form-control" placeholder="Số nhà, Đường, Quận/Huyện">
          </div>
        </div>

        <!-- Doctor Fields -->
        <div class="doctor-field hidden">
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label" for="specialtyId">Chuyên khoa</label>
              <select id="specialtyId" class="form-control" required></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="degree">Bằng cấp / Học vị</label>
              <input type="text" id="degree" class="form-control" placeholder="Bác sĩ CKI, Thạc sĩ...">
            </div>
          </div>
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label" for="experienceYears">Số năm kinh nghiệm</label>
              <input type="number" id="experienceYears" class="form-control" placeholder="5" value="5">
            </div>
            <div class="form-group">
              <label class="form-label" for="consultationFee">Giá khám (VNĐ)</label>
              <input type="number" id="consultationFee" class="form-control" placeholder="200000" value="200000">
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full mt-2 btn-lg" id="btn-submit">
          Tạo Tài Khoản
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>
  </div>

  <script defer src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script defer src="js/pages/auth-register.js"></script>
</body>
</html>
