<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Bệnh Án - DatLichKhamBenh</title>
  <link href="../vendor/bootstrap.min.css" rel="stylesheet">
  <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background-color: #f8fafc; color: #1e293b; }
    .sidebar { background: #0f172a; color: #fff; min-height: 100vh; }
    .sidebar .nav-link { color: #94a3b8; border-radius: 10px; margin-bottom: 4px; padding: 10px 16px; font-weight: 500; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #1e293b; color: #38bdf8; }
    .record-card { border-radius: 16px; border: 1px solid #e2e8f0; background: #fff; transition: all 0.2s ease; }
    .record-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
          <div class="bg-primary text-white rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
            <i class="bi bi-hospital fs-4"></i>
          </div>
          <div>
            <h6 class="fw-bold mb-0 text-white">Bệnh Nhân</h6>
            <small class="text-secondary">DatLichKhamBenh</small>
          </div>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item"><a href="dashboard.html" class="nav-link d-flex align-items-center gap-2"><i class="bi bi-search fs-5"></i> Tìm & Đặt Bác Sĩ</a></li>
          <li class="nav-item"><a href="appointments.html" class="nav-link d-flex align-items-center gap-2"><i class="bi bi-calendar-event fs-5"></i> Lịch Hẹn Của Tôi</a></li>
          <li class="nav-item"><a href="medical-records.html" class="nav-link active d-flex align-items-center gap-2"><i class="bi bi-file-earmark-medical fs-5"></i> Hồ Sơ Bệnh Án</a></li>
          <li class="nav-item"><a href="profile.html" class="nav-link d-flex align-items-center gap-2"><i class="bi bi-person-gear fs-5"></i> Thông Tin Cá Nhân</a></li>
        </ul>
        <hr class="text-secondary my-4">
        <div class="d-flex align-items-center justify-content-between px-2">
          <div class="d-flex align-items-center gap-2">
            <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px;" id="user-avatar">P</div>
            <div class="fw-semibold text-white small" id="user-name">Bệnh nhân</div>
          </div>
          <button data-ui-click="action2" class="btn btn-outline-danger btn-sm border-0"><i class="bi bi-box-arrow-right fs-5"></i></button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2 class="fw-bold text-dark mb-1"><i class="bi bi-file-earmark-medical text-primary me-2"></i>Hồ Sơ Bệnh Án</h2>
            <p class="text-muted mb-0">Toàn bộ kết quả chẩn đoán, đơn thuốc từ các lần khám bệnh đã hoàn thành</p>
          </div>
          <a href="appointments.html" class="btn btn-outline-primary rounded-pill fw-semibold">
            <i class="bi bi-calendar-event me-1"></i>Xem Lịch Hẹn
          </a>
        </div>

        <!-- Records container -->
        <div id="records-container" class="d-flex flex-column gap-3">
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted fw-medium">Đang tải hồ sơ bệnh án...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal fade" id="record-detail-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 bg-success text-white rounded-top-4 py-3">
          <h5 class="modal-title fw-bold"><i class="bi bi-clipboard2-pulse me-2"></i>Chi Tiết Hồ Sơ Bệnh Án</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="record-detail-content"></div>
        <div class="modal-footer border-0 bg-light rounded-bottom-4">
          <button class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script defer src="../vendor/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/pages/patient-medical-records.js"></script>
<script src="../js/ui-actions.js"></script>
</body>
</html>
