# =====================================================================
# application-test.yml -- Profile "test"
# Dung cho smoke test / unit test, khong can MySQL hoac Redis that.
# H2 in-memory thay the MySQL; Redis duoc disable de tranh loi ket noi.
# =====================================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Tat auto-config Redis de tranh ket noi that khi chay test
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

  # Tat mail sender
  mail:
    host: localhost
    port: 25

  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-must-be-256bit-long-enough
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  cache:
    doctor-list-ttl: 60
    available-slots-ttl: 30

logging:
  level:
    root: WARN
    com.datlichkhambenh: INFO
