# =====================================================================
# application.yml — DatLichKhamBenh Backend
# Clone về → Run ngay: DB tự tạo, bảng tự sinh, seed data tự load.
# =====================================================================

spring:
  application:
    name: datlichkhambenh-backend

  # ─── MySQL ───────────────────────────────────────────────────────
  datasource:
    # createDatabaseIfNotExist=true → tự tạo DB nếu chưa có
    url: ${DB_URL:jdbc:mysql://localhost:3307/datlichkhambenh?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

  # ─── JPA / Hibernate ─────────────────────────────────────────────
  jpa:
    hibernate:
      # update → Hibernate tự tạo/cập nhật bảng theo Entity Java
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    # Phải true để schema.sql chạy SAU KHI Hibernate tạo xong bảng
    defer-datasource-initialization: true

  # ─── SQL Initialization (schema.sql + data.sql) ──────────────────
  sql:
    init:
      # DatabaseInitializer (CommandLineRunner) handles seeding with valid BCrypt hashes
      mode: never
      encoding: UTF-8

  # ─── Redis ───────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # ─── Mail (Async Email Notification) ─────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

  # ─── Async Task Executor ──────────────────────────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: async-email-

# ─── Server ──────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# ─── JWT ─────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}         # 24 giờ
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 ngày

  # ─── Redis Cache TTL (giây) ──────────────────────────────────────
  cache:
    doctor-list-ttl: ${CACHE_DOCTOR_LIST_TTL:300}          # 5 phút
    available-slots-ttl: ${CACHE_AVAILABLE_SLOTS_TTL:60}   # 1 phút

  messaging:
    email-exchange: clinic.email.exchange
    email-queue: clinic.email.queue
    email-routing-key: clinic.email.send

# ─── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ─────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.datlichkhambenh: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${LOG_SQL_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
