<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Cá Nhân - DatLichKhamBenh</title>
  <link href="../vendor/bootstrap.min.css?v=3017df4a76db" rel="stylesheet">
  <link href="../vendor/bootstrap-icons.css?v=bb6fd8cd8539" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=ac95df229b43">
  <style>
    body { background-color: #f8fafc; color: #1e293b; }
    .sidebar { background: #0f172a; color: #fff; min-height: 100vh; }
    .sidebar .nav-link { color: #94a3b8; border-radius: 10px; margin-bottom: 4px; padding: 10px 16px; font-weight: 500; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #1e293b; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
          <div class="bg-primary text-white rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
            <i class="bi bi-hospital fs-4"></i>
          </div>
          <div>
            <h6 class="fw-bold mb-0 text-white">Bệnh Nhân</h6>
            <small class="text-secondary">DatLichKhamBenh</small>
          </div>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item"><a href="dashboard.html" class="nav-link d-flex align-items-center gap-2"><i class="bi bi-search fs-5"></i> Tìm & Đặt Bác Sĩ</a></li>
          <li class="nav-item"><a href="appointments.html" class="nav-link d-flex align-items-center gap-2"><i class="bi bi-calendar-event fs-5"></i> Lịch Hẹn Của Tôi</a></li>
          <li class="nav-item"><a href="medical-records.html" class="nav-link d-flex align-items-center gap-2"><i class="bi bi-file-earmark-medical fs-5"></i> Hồ Sơ Bệnh Án</a></li>
          <li class="nav-item"><a href="profile.html" class="nav-link active d-flex align-items-center gap-2"><i class="bi bi-person-gear fs-5"></i> Thông Tin Cá Nhân</a></li>
        </ul>
        <hr class="text-secondary my-4">
        <div class="d-flex align-items-center justify-content-between px-2">
          <div class="d-flex align-items-center gap-2">
            <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px;" id="user-avatar">P</div>
            <div class="fw-semibold text-white small" id="user-name">Bệnh nhân</div>
          </div>
          <button data-ui-click="action2" class="btn btn-outline-danger btn-sm border-0"><i class="bi bi-box-arrow-right fs-5"></i></button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <div class="mb-4">
          <h2 class="fw-bold text-dark mb-1"><i class="bi bi-person-gear text-primary me-2"></i>Thông Tin Cá Nhân</h2>
          <p class="text-muted mb-0">Cập nhật hồ sơ sức khỏe và đổi mật khẩu tài khoản của bạn</p>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4" role="tablist">
          <li class="nav-item">
            <button class="nav-link active fw-semibold" data-bs-toggle="tab" data-bs-target="#tab-profile" type="button">
              <i class="bi bi-person-lines-fill me-1"></i> Hồ Sơ Sức Khỏe
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link fw-semibold" data-bs-toggle="tab" data-bs-target="#tab-password" type="button">
              <i class="bi bi-shield-lock me-1"></i> Đổi Mật Khẩu
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- Tab Profile -->
          <div class="tab-pane fade show active" id="tab-profile">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
              <div id="profile-feedback" class="mb-3" role="status" aria-live="polite"></div><form id="profile-form">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
                    <input id="fullName" class="form-control rounded-3" required minlength="2" placeholder="Nguyễn Văn A">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Email (không thể thay đổi)</label>
                    <input id="email" class="form-control rounded-3 bg-light" disabled>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">Ngày Sinh</label>
                    <input id="dob" type="date" class="form-control rounded-3">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">Giới Tính</label>
                    <select id="gender" class="form-select rounded-3">
                      <option value="MALE">Nam</option>
                      <option value="FEMALE">Nữ</option>
                      <option value="OTHER">Khác</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">Số Điện Thoại <span class="text-danger">*</span></label>
                    <input id="phone" class="form-control rounded-3" pattern="[0-9+]{9,15}" required placeholder="0912345678">
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold">Địa Chỉ</label>
                    <input id="address" class="form-control rounded-3" placeholder="Số nhà, Đường, Quận/Huyện, Tỉnh/Thành phố">
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold">Tiền Sử Bệnh / Dị Ứng Thuốc</label>
                    <textarea id="medicalHistory" rows="4" class="form-control rounded-3" placeholder="Ghi rõ các bệnh mãn tính, dị ứng thuốc hoặc các điều cần lưu ý..."></textarea>
                  </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                  <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold" id="btn-save">
                    <i class="bi bi-check2-circle me-1"></i>Lưu Thay Đổi
                  </button>
                  <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-ui-click="action3">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Hủy Bỏ
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Tab Change Password -->
          <div class="tab-pane fade" id="tab-password">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="max-width: 520px;">
              <h6 class="fw-bold text-dark mb-3"><i class="bi bi-shield-lock text-primary me-2"></i>Đổi Mật Khẩu Tài Khoản</h6>
              <form id="password-form">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Mật khẩu hiện tại <span class="text-danger">*</span></label>
                  <input id="currentPassword" type="password" class="form-control rounded-3" required placeholder="Nhập mật khẩu hiện tại">
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
                  <input id="newPassword" type="password" class="form-control rounded-3" required minlength="8" placeholder="Ít nhất 8 ký tự, bao gồm chữ hoa, số">
                </div>
                <div class="mb-4">
                  <label class="form-label fw-semibold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                  <input id="confirmPassword" type="password" class="form-control rounded-3" required minlength="8" placeholder="Nhập lại mật khẩu mới">
                </div>
                <button type="submit" class="btn btn-warning rounded-pill px-4 fw-semibold" id="btn-change-pw">
                  <i class="bi bi-key me-1"></i>Cập Nhật Mật Khẩu
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script defer src="../vendor/bootstrap.bundle.min.js?v=82f64f62bb03"></script>
  <script src="../js/api.js?v=4d8855c5ee40"></script>
  <script src="../js/utils.js?v=82f165ee9d32"></script>
  <script src="../js/auth.js?v=58ccc9a11049"></script>
  <script src="../js/pages/patient-profile.js?v=d05c751f0d1b"></script>
<script src="../js/ui-actions.js?v=5460146e952c"></script>
</body>
</html>
