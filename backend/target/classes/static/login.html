<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - DatLichKhamBenh</title>
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">🏥</div>
        <h1>Đăng Nhập Hệ Thống</h1>
        <p>Nhập thông tin tài khoản để tiếp tục</p>
      </div>

      <div id="error-alert" role="alert" aria-live="polite" class="alert alert-error hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@clinic.vn" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <div style="position:relative;">
            <input type="password" id="password" class="form-control" placeholder="Mật khẩu" required autocomplete="current-password" style="padding-right:2.8rem;">
            <button type="button" id="toggle-password" aria-label="Hiện hoặc ẩn mật khẩu"
              style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#66758a;cursor:pointer;padding:4px;">
              <i class="bi bi-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-end mb-2">
          <a href="#" class="text-primary fw-semibold small" id="forgot-link" style="text-decoration:none;">
            <i class="bi bi-key me-1"></i>Quên mật khẩu?
          </a>
        </div>

        <button type="submit" class="btn btn-primary w-full mt-1 btn-lg" id="btn-submit">
          Đăng Nhập
        </button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký Bệnh nhân</a><br><a href="account.html">Gửi lại email xác minh</a>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgot-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius:22px;">
        <div class="modal-header border-0 pb-0 px-4 pt-4">
          <h5 class="modal-title fw-bold"><i class="bi bi-key-fill text-primary me-2"></i>Quên Mật Khẩu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body px-4 pb-4">
          <p class="text-muted small mb-3">
            Nhập email để yêu cầu liên kết đặt lại mật khẩu. Liên kết hết hạn sau 30 phút và chỉ dùng được một lần.
          </p>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="forgot-email">Email tài khoản của bạn</label>
            <input type="email" id="forgot-email" class="form-control" placeholder="Nhập email tài khoản..." autocomplete="email">
          </div>
          <button class="btn btn-primary w-100 rounded-pill fw-semibold" id="btn-forgot-send">
            <i class="bi bi-info-circle me-1"></i> Gửi liên kết đặt lại
          </button>
        </div>
      </div>
    </div>
  </div>

  <script defer src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script defer src="js/pages/auth-login.js"></script>
</body>
</html>
