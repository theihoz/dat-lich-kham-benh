name: CI
on:
  push:
    branches: [main, thaihoa]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-security:
    uses: ./.github/workflows/security.yml
  backend:
    name: Test và đóng gói backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests và JAR chạy được
        run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-jar
          path: backend/target/backend-0.0.1-SNAPSHOT.jar

  docs:
    name: Sơ đồ và frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra file draw.io
        run: python3 scripts/validate_diagrams.py
      - name: Frontend khớp static/
        run: python3 scripts/sync_frontend.py --check
      - name: Kiểm thử hồi quy frontend
        run: |
          node scripts/frontend_regression.cjs
          node scripts/auth_regression.cjs
          python3 scripts/operations_regression.py
          python3 scripts/version_frontend_assets.py --check

  docker:
    name: Build image và smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clinic-backend:ci backend
      - name: Chạy container (profile demo)
        run: docker run -d --name clinic -e SPRING_PROFILES_ACTIVE=demo -p 8080:8080 clinic-backend:ci
      - name: Chờ readiness (seed xong)
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health/readiness | grep -q UP && exit 0
            sleep 2
          done
          docker logs clinic
          exit 1
      - name: Đăng nhập tài khoản demo
        run: |
          curl -fs -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"bn.hoangminh@gmail.com","password":"Patient@123"}' | grep -q accessToken
      - name: Log container khi lỗi
        if: failure()
        run: docker logs clinic

  real-services:
    name: MySQL Redis RabbitMQ SMTP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start isolated services
        run: docker compose -f compose.integration.yml up -d --wait --wait-timeout 180
      - name: Migrations concurrency cache and email delivery
        env:
          CLINIC_REAL_SERVICES: 'true'
        run: mvn -B -f backend/pom.xml -Dtest=RealServicesIntegrationTests test
      - name: Stop isolated services
        if: always()
        run: docker compose -f compose.integration.yml down -v

  browser:
    name: Mobile desktop CSP and browser flows
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: clinic-jar
          path: backend/target
      - name: Install browser tools outside repository
        run: |
          mkdir -p /tmp/clinic-pw
          npm install --prefix /tmp/clinic-pw playwright
          /tmp/clinic-pw/node_modules/.bin/playwright install --with-deps chrome
      - name: Responsive strict CSP and keyboard
        env:
          NODE_PATH: /tmp/clinic-pw/node_modules
        run: node scripts/ui_browser_regression.cjs
      - name: Start isolated demo
        run: java -jar backend/target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=demo > /tmp/clinic.log 2>&1 &
      - name: Wait for seeded demo and run real browser flow
        env:
          NODE_PATH: /tmp/clinic-pw/node_modules
          CLINIC_BASE_URL: http://localhost:18080
          CLINIC_QA_OUTPUT: /tmp/clinic-browser-evidence
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:18080/actuator/health/readiness && break
            sleep 2
          done
          node scripts/browser_qa.cjs
          node scripts/account_browser_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: /tmp/clinic-browser-evidence
