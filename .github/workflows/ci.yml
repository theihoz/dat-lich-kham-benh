name: CI
on:
  push:
    branches: [main, thaihoa]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Test và đóng gói backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests và JAR chạy được
        run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-jar
          path: backend/target/backend-0.0.1-SNAPSHOT.jar

  docs:
    name: Sơ đồ và frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra file draw.io
        run: python3 scripts/validate_diagrams.py
      - name: Frontend khớp static/
        run: python3 scripts/sync_frontend.py --check

  docker:
    name: Build image và smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clinic-backend:ci backend
      - name: Chạy container (profile demo)
        run: docker run -d --name clinic -p 8080:8080 clinic-backend:ci
      - name: Chờ readiness (seed xong)
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health/readiness | grep -q UP && exit 0
            sleep 2
          done
          docker logs clinic
          exit 1
      - name: Đăng nhập tài khoản demo
        run: |
          curl -fs -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"bn.hoangminh@gmail.com","password":"Patient@123"}' | grep -q accessToken
      - name: Log container khi lỗi
        if: failure()
        run: docker logs clinic
