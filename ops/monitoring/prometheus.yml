global:
  scrape_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: clinic
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/clinic_metrics_token
    static_configs:
      - targets: [backend:8080]
  - job_name: backup
    static_configs:
      - targets: [backup-exporter:9100]
