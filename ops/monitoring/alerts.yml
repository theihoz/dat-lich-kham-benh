groups:
  - name: clinic
    rules:
      - alert: ClinicUnavailable
        expr: up{job="clinic"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Clinic metrics target unavailable"}
      - alert: ClinicHighServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.01) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Clinic 5xx exceeds 5% for 5 minutes"}
      - alert: ClinicSlowRequests
        expr: sum(rate(http_server_requests_seconds_sum[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.01) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Mean request duration exceeds one second"}
      - alert: ClinicDatabasePoolSaturated
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Clinic DB pool above 90%"}
      - alert: ClinicOutboxBacklog
        expr: clinic_notifications_outbox_pending > 100
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Email delivery outbox backlog"}
      - alert: ClinicBackupStale
        expr: time() - clinic_backup_last_success_unixtime > 90000
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "No successful clinic backup in 25 hours"}
      - alert: ClinicOutboxDeadLetters
        expr: clinic_notifications_outbox_dead > 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Clinic notifications exhausted publish retries"}
      - alert: ClinicBackupMetricMissing
        expr: absent(clinic_backup_last_success_unixtime)
        for: 25h
        labels: {severity: critical}
        annotations: {summary: "No backup success metric received"}
      - alert: ClinicConsumerDeadLetters
        expr: clinic_notifications_consumer_dead > 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Notification consumer messages reached the dead-letter queue"}
