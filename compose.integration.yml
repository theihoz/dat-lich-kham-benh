name: clinic-integration
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: clinic_integration
      MYSQL_USER: clinic
      MYSQL_PASSWORD: local-integration-db-password
      MYSQL_ROOT_PASSWORD: local-integration-root-password
    ports: ["127.0.0.1:13316:3306"]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -u clinic -D clinic_integration -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16386:6379"]
    command: [redis-server, --requirepass, local-integration-cache-password]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=local-integration-cache-password redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: clinic
      RABBITMQ_DEFAULT_PASS: local-integration-broker-password
    ports: ["127.0.0.1:15686:5672", "127.0.0.1:15687:15672"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  mail:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:11026:1025", "127.0.0.1:18026:8025"]
