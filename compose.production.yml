name: clinic-production
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CLINIC_DOMAIN: ${CLINIC_DOMAIN:?Set CLINIC_DOMAIN}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
    networks: [frontend]
  backend:
    image: ${CLINIC_IMAGE:?Set immutable CLINIC_IMAGE tag or digest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_PUBLIC_URL: https://${CLINIC_DOMAIN}
      DB_URL: jdbc:mysql://mysql:3306/clinic?sslMode=REQUIRED&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: clinic
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: clinic
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      CLINIC_NAME: ${CLINIC_NAME:-Phòng khám}
      CLINIC_ADDRESS: ${CLINIC_ADDRESS:?Set real CLINIC_ADDRESS}
      CLINIC_PHONE: ${CLINIC_PHONE:?Set CLINIC_PHONE}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [frontend, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    stop_grace_period: 45s
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinic
      MYSQL_USER: clinic
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u clinic -D clinic -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: clinic
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [data]
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${METRICS_TOKEN_FILE:-./.secrets/metrics_token}:/run/secrets/clinic_metrics_token:ro
      - prometheus_data:/prometheus
    networks: [frontend]
  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ${ALERTMANAGER_CONFIG:-./ops/monitoring/alertmanager.example.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [frontend]
  backup-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    command: [--collector.disable-defaults, --collector.textfile, --collector.textfile.directory=/metrics]
    volumes: ["${CLINIC_BACKUP_METRICS_DIR:-./backups/metrics}:/metrics:ro"]
    networks: [frontend]
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ["127.0.0.1:${GRAFANA_HTTP_PORT:-13000}:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/monitoring/grafana:/etc/grafana/provisioning:ro
    networks: [frontend]

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  mysql_data:
  redis_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
networks:
  frontend:
  data: {internal: true}
